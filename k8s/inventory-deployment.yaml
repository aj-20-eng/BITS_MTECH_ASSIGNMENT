apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: stockpilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: doklab/stockpilot-inventory-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: DB_PATH
              value: /data/inventory.db
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:5001
          volumeMounts:
            - name: inventory-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: inventory-data
          persistentVolumeClaim:
            claimName: inventory-data-pvc
